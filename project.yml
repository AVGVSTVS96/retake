name: VoiceMemos
options:
  bundleIdPrefix: com.shahidy
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  MemoKit:
    path: Packages/MemoKit
targets:
  Memos:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MemoKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Memos
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Memos uses the microphone to record voice memos.
        NSSpeechRecognitionUsageDescription: Memos transcribes your recordings on device.
        NSLocationWhenInUseUsageDescription: Memos names new recordings after where you are.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.memos
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
