name: Retake
options:
  bundleIdPrefix: com.shahidy
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  MemoKit:
    path: Packages/MemoKit
targets:
  Retake:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: MemoKit
      - target: RetakeWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: retake
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: retake uses the microphone to record voice memos.
        NSSpeechRecognitionUsageDescription: retake transcribes your recordings on device.
        NSLocationWhenInUseUsageDescription: retake names new recordings after where you are.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.retake
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  RetakeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: retake
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.retake.widgets
        GENERATE_INFOPLIST_FILE: NO
  RetakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Retake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.retake.uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Retake
schemes:
  Retake:
    build:
      targets:
        Retake: all
        RetakeUITests: [test]
    test:
      targets: [RetakeUITests]
